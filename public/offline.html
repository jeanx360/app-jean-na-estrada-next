<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>JNE App — Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f1f5f9;
        background: radial-gradient(circle at top, #10284b, transparent 35rem), #050505;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        background: rgba(18, 18, 18, 0.94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      span { color: #38bdf8; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: clamp(28px, 7vw, 44px); }
      p { color: #9ca3af; line-height: 1.65; }
      button {
        margin-top: 12px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #2979ff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span>JNE App</span>
      <h1>Você está sem conexão.</h1>
      <p>
        As páginas visitadas anteriormente podem continuar disponíveis. Reconecte-se para abrir
        vídeos, arquivos externos e receber novos conteúdos.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
