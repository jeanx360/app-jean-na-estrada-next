name: Atualizar conteúdo automático

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Atualizar vídeos e notícias
        run: npm run sync-content

      - name: Salvar feed atualizado
        run: |
          if git diff --quiet -- public/data/content-feed.json; then
            echo "Nenhuma alteração no feed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/content-feed.json
          git commit -m "chore: atualizar conteúdo automático"
          git push
